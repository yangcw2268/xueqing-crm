<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 学情同步业务数据系统</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 48px 40px;
      width: 400px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
    }
    .login-logo p {
      color: #999;
      font-size: 14px;
    }
    .login-error {
      background: #fee;
      color: #e74c3c;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .feishu-login-btn {
      width: 100%;
      padding: 14px;
      background: #3370ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .feishu-login-btn:hover {
      opacity: 0.9;
    }
    .feishu-login-btn svg {
      width: 20px;
      height: 20px;
    }
    .password-login-toggle {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #bbb;
      cursor: pointer;
      transition: color 0.2s;
    }
    .password-login-toggle:hover {
      color: #999;
    }
    .password-login-form {
      display: none;
    }
    .password-login-form .form-group {
      margin-bottom: 20px;
    }
    .password-login-form label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 14px;
    }
    .password-login-form input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    .password-login-form input:focus {
      outline: none;
      border-color: #667eea;
    }
    .password-login-form button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .password-login-form button:hover {
      opacity: 0.9;
    }
    .login-form-error {
      color: #e74c3c;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .login-hint {
      text-align: center;
      margin-top: 24px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <h1>学情同步业务数据系统</h1>
      <p>全业务周期数据化管理</p>
    </div>
    <div class="login-error" id="loginError"></div>

    <button class="feishu-login-btn" id="feishuLoginBtn">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 14.5h-9v-1h9v1zm0-3h-9v-1h9v1zm0-3h-9V9.5h9v1z"/>
      </svg>
      使用飞书登录
    </button>

    <div class="password-login-toggle" id="togglePasswordLogin">账号密码登录</div>

    <div class="password-login-form" id="passwordLoginForm">
      <div class="form-group">
        <label for="username">姓名</label>
        <input type="text" id="username" placeholder="请输入姓名">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <button type="button" id="passwordLoginBtn">登 录</button>
      <div class="login-form-error" id="loginFormError"></div>
      <div class="login-hint">默认密码: 123456</div>
    </div>
  </div>

  <script>
    const loginError = document.getElementById('loginError');
    const feishuLoginBtn = document.getElementById('feishuLoginBtn');
    const togglePasswordLogin = document.getElementById('togglePasswordLogin');
    const passwordLoginForm = document.getElementById('passwordLoginForm');
    const passwordLoginBtn = document.getElementById('passwordLoginBtn');
    const loginFormError = document.getElementById('loginFormError');

    // 如果已登录，根据角色直接跳转到默认页面
    const token = localStorage.getItem('token');
    if (token) {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const defaultView = (user.role === '员工') ? 'operatorDashboard' : 'salesDashboard';
      window.location.href = '/' + '#' + defaultView;
    }

    // 处理URL参数中的错误信息（飞书OAuth回调可能带回错误）
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    if (error) {
      loginError.textContent = decodeURIComponent(error);
      loginError.style.display = 'block';
    }

    // 飞书登录按钮
    feishuLoginBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/auth/feishu/redirect');
        const result = await response.json();

        if (result.success) {
          window.location.href = result.data.authUrl;
        } else {
          loginError.textContent = result.message || '飞书登录失败';
          loginError.style.display = 'block';
        }
      } catch (err) {
        loginError.textContent = '网络错误，请检查网络连接';
        loginError.style.display = 'block';
      }
    });

    // 切换账号密码登录表单
    togglePasswordLogin.addEventListener('click', () => {
      if (passwordLoginForm.style.display === 'block') {
        passwordLoginForm.style.display = 'none';
        togglePasswordLogin.textContent = '账号密码登录';
      } else {
        passwordLoginForm.style.display = 'block';
        togglePasswordLogin.textContent = '收起';
      }
    });

    // 账号密码登录
    passwordLoginBtn.addEventListener('click', async () => {
      loginFormError.style.display = 'none';
      loginError.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        loginFormError.textContent = '请输入姓名和密码';
        loginFormError.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: username, password }),
        });

        const result = await response.json();

        if (result.success) {
          localStorage.setItem('token', result.data.token);
          localStorage.setItem('user', JSON.stringify(result.data.user));
          // 根据角色跳转到对应的默认页面
          const role = result.data.user.role;
          const defaultView = (role === '员工') ? 'operatorDashboard' : 'salesDashboard';
          window.location.href = '/' + '#' + defaultView;
        } else {
          loginFormError.textContent = result.message || '登录失败，请检查用户名和密码';
          loginFormError.style.display = 'block';
        }
      } catch (err) {
        loginFormError.textContent = '网络错误，请检查网络连接';
        loginFormError.style.display = 'block';
      }
    });
  </script>
</body>
</html>
